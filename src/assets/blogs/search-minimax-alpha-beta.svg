<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">三层 Minimax 博弈树与 alpha beta 剪枝</title>
  <desc id="desc">根节点 MAX 的三个 MIN 子节点从左到右搜索。叶值向上回传后根值为 5。B 分支的 8、9 和 C 分支的 6 被 alpha beta 剪枝。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .nodeTitle{font:800 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}
      .value{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155;text-anchor:middle}
      .leaf{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
      .cutValue{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b91c1c;text-anchor:middle;dominant-baseline:middle}
      .edge{stroke:#94a3b8;stroke-width:3;stroke-linecap:round}
      .chosen{stroke:#2563eb;stroke-width:7}
      .cut{stroke:#dc2626;stroke-width:4;stroke-dasharray:10 8}
      .node{fill:#ffffff;stroke:#94a3b8;stroke-width:2.5}
      .root{fill:#e8f2fb;stroke:#2a6fa0;stroke-width:3}
      .leafNode{fill:#ffffff;stroke:#94a3b8;stroke-width:2.5}
      .cutLeaf{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5;stroke-dasharray:7 5}
      .math{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .cutText{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#b91c1c;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="730" rx="24" fill="#f8fafc"/>
  <text class="title" x="56" y="58">Minimax 数值回传与 α–β 剪枝</text>
  <text class="sub" x="56" y="91">三层树按从左到右搜索；红色虚线分支在触发 α ≥ β 后不再求值。</text>

  <text class="sub" x="112" y="154" font-weight="700">MAX 层</text>
  <text class="sub" x="112" y="305" font-weight="700">MIN 层</text>
  <text class="sub" x="112" y="458" font-weight="700">叶节点</text>

  <g aria-hidden="true">
    <line class="edge chosen" x1="600" y1="186" x2="250" y2="326"/>
    <line class="edge" x1="600" y1="186" x2="600" y2="326"/>
    <line class="edge" x1="600" y1="186" x2="950" y2="326"/>

    <line class="edge" x1="250" y1="392" x2="120" y2="492"/>
    <line class="edge" x1="250" y1="392" x2="250" y2="492"/>
    <line class="edge" x1="250" y1="392" x2="380" y2="492"/>

    <line class="edge" x1="600" y1="392" x2="500" y2="492"/>
    <line class="cut" x1="600" y1="392" x2="600" y2="492"/>
    <line class="cut" x1="600" y1="392" x2="700" y2="492"/>

    <line class="edge" x1="950" y1="392" x2="830" y2="492"/>
    <line class="edge" x1="950" y1="392" x2="950" y2="492"/>
    <line class="cut" x1="950" y1="392" x2="1070" y2="492"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(600 166)">
      <rect class="root" x="-76" y="-43" width="152" height="86" rx="18"/>
      <text class="nodeTitle" y="-7">MAX</text><text class="value" y="20">V = max(5, 4, 5) = 5</text>
    </g>
    <g transform="translate(250 356)">
      <rect class="node" x="-68" y="-39" width="136" height="78" rx="16"/>
      <text class="nodeTitle" y="-5">A · MIN</text><text class="value" y="21">V = 5</text>
    </g>
    <g transform="translate(600 356)">
      <rect class="node" x="-68" y="-39" width="136" height="78" rx="16"/>
      <text class="nodeTitle" y="-5">B · MIN</text><text class="value" y="21">V ≤ 4</text>
    </g>
    <g transform="translate(950 356)">
      <rect class="node" x="-68" y="-39" width="136" height="78" rx="16"/>
      <text class="nodeTitle" y="-5">C · MIN</text><text class="value" y="21">V = 5</text>
    </g>

    <circle class="leafNode" cx="120" cy="520" r="29"/><text class="leaf" x="120" y="521">5</text>
    <circle class="leafNode" cx="250" cy="520" r="29"/><text class="leaf" x="250" y="521">6</text>
    <circle class="leafNode" cx="380" cy="520" r="29"/><text class="leaf" x="380" y="521">7</text>
    <circle class="leafNode" cx="500" cy="520" r="29"/><text class="leaf" x="500" y="521">4</text>
    <circle class="cutLeaf" cx="600" cy="520" r="29"/><text class="cutValue" x="600" y="521">8</text>
    <circle class="cutLeaf" cx="700" cy="520" r="29"/><text class="cutValue" x="700" y="521">9</text>
    <circle class="leafNode" cx="830" cy="520" r="29"/><text class="leaf" x="830" y="521">7</text>
    <circle class="leafNode" cx="950" cy="520" r="29"/><text class="leaf" x="950" y="521">5</text>
    <circle class="cutLeaf" cx="1070" cy="520" r="29"/><text class="cutValue" x="1070" y="521">6</text>
  </g>

  <g aria-hidden="true">
    <line x1="583" y1="503" x2="617" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="617" y1="503" x2="583" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="683" y1="503" x2="717" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="717" y1="503" x2="683" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="1053" y1="503" x2="1087" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="1087" y1="503" x2="1053" y2="537" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="cutText" x="650" y="577">β=4 ≤ α=5，剪掉 8、9</text>
  <text class="cutText" x="1010" y="577">β=5 ≤ α=5，剪掉 6</text>

  <g transform="translate(56 612)">
    <rect width="1088" height="84" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="math" x="24" y="33">① A 回传 min(5,6,7)=5，根节点更新 α=5。</text>
    <text class="math" x="24" y="61">② B 读到 4 后立即截止；C 依次读到 7、5 后截止。被划掉的叶值仅为讲解而显示，算法并未访问。</text>
    <line x1="822" y1="28" x2="874" y2="28" class="chosen"/><text class="math" x="891" y="34">最终选择</text>
    <line x1="822" y1="58" x2="874" y2="58" class="cut"/><text class="math" x="891" y="64">被剪分支</text>
  </g>
</svg>
