<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">同一个迷宫中 DFS 与 BFS 的搜索结果对比</title>
  <desc id="desc">DFS 按下、右、上、左的邻居优先级找到一条 16 步路径并检查 17 个节点；BFS 找到 12 步最短路径，但在到达目标前检查了 25 个节点。</desc>
  <defs>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .panel{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .metric{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .caption{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .cell{stroke:#cbd5e1;stroke-width:1.5}
      .path{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .sg{font:800 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
    </style>
    <g id="open-cells">
      <rect class="cell" x="46" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="90" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="178" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="266" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="354" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="398" y="46" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="90" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="398" y="90" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="178" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="354" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="398" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="90" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="266" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="222" width="40" height="40" rx="4" fill="currentColor"/>
    </g>
    <g id="lower-cells">
      <rect class="cell" x="46" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="46" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="90" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="134" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="178" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="222" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="266" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="222" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="178" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="310" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="354" y="134" width="40" height="40" rx="4" fill="currentColor"/>
      <rect class="cell" x="398" y="134" width="40" height="40" rx="4" fill="currentColor"/>
    </g>
    <polyline id="lower-path" points="66,154 66,198 66,242 110,242 154,242 154,198 154,154 198,154 242,154 242,198 242,242 286,242 330,242 330,198 330,154 374,154 418,154"/>
    <polyline id="upper-path" points="66,154 66,110 66,66 110,66 154,66 198,66 242,66 286,66 330,66 374,66 418,66 418,110 418,154"/>
  </defs>

  <rect width="1200" height="710" rx="24" fill="#f8fafc"/>
  <text class="title" x="56" y="58">同一迷宫：DFS 找得快，不等于路径短</text>
  <text class="sub" x="56" y="91">两种算法都在节点离开 frontier 时做目标检查；邻居优先级固定为 下 → 右 → 上 → 左。</text>

  <g transform="translate(60 0)">
    <text class="panel" x="0" y="132">DFS</text>
    <text class="metric" x="484" y="132" text-anchor="end" fill="#c2410c">16 步 · 检查 17 个节点</text>
    <g transform="translate(0 155)">
      <rect width="484" height="308" rx="12" fill="#334155"/>
      <use href="#open-cells" color="#ffffff"/>
      <use href="#lower-cells" color="#ffedd5"/>
      <use href="#lower-path" class="path" stroke="#ea580c"/>
      <circle cx="66" cy="154" r="17" fill="#15803d"/><text class="sg" x="66" y="155">S</text>
      <circle cx="418" cy="154" r="17" fill="#0f172a"/><text class="sg" x="418" y="155">G</text>
    </g>
    <text class="caption" x="242" y="493" text-anchor="middle">沿下方分支一直深入，第一次到达 G 即停止</text>
  </g>

  <g transform="translate(656 0)">
    <text class="panel" x="0" y="132">BFS</text>
    <text class="metric" x="484" y="132" text-anchor="end" fill="#1d4ed8">12 步 · 检查 25 个节点</text>
    <g transform="translate(0 155)">
      <rect width="484" height="308" rx="12" fill="#334155"/>
      <use href="#open-cells" color="#dbeafe"/>
      <rect class="cell" x="310" y="178" width="40" height="40" rx="4" fill="#ffffff"/>
      <rect class="cell" x="310" y="134" width="40" height="40" rx="4" fill="#ffffff"/>
      <rect class="cell" x="354" y="134" width="40" height="40" rx="4" fill="#ffffff"/>
      <use href="#upper-path" class="path" stroke="#2563eb"/>
      <circle cx="66" cy="154" r="17" fill="#15803d"/><text class="sg" x="66" y="155">S</text>
      <circle cx="418" cy="154" r="17" fill="#0f172a"/><text class="sg" x="418" y="155">G</text>
    </g>
    <text class="caption" x="242" y="493" text-anchor="middle">逐层扩展，目标第一次出队时得到无权最短路</text>
  </g>

  <g transform="translate(56 548)">
    <rect width="1088" height="106" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="40" cy="36" r="10" fill="#ffedd5" stroke="#fdba74"/><text class="caption" x="60" y="41">DFS 已检查</text>
    <circle cx="208" cy="36" r="10" fill="#dbeafe" stroke="#93c5fd"/><text class="caption" x="228" y="41">BFS 已检查</text>
    <line x1="394" y1="36" x2="438" y2="36" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/><text class="caption" x="454" y="41">DFS 返回路径</text>
    <line x1="624" y1="36" x2="668" y2="36" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/><text class="caption" x="684" y="41">BFS 返回路径</text>
    <text class="sub" x="544" y="78" text-anchor="middle">这个例子里，BFS 为保证最短路检查了更多节点；DFS 更早找到的却是一条更长路径。</text>
  </g>
</svg>
