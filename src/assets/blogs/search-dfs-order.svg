<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">深度优先搜索的访问顺序</title>
  <desc id="desc">邻居按从左到右生成时，DFS 依次访问 S、A、D、H、I、E、J、B、F、C、G，并在最后找到目标 G。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
      .small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}
      .edge{stroke:#cbd5e1;stroke-width:4;stroke-linecap:round}
      .node{fill:#ffffff;stroke:#94a3b8;stroke-width:2.5}
      .visited{fill:#e8f2fb;stroke:#2a6fa0}
      .goal{fill:#dcfce7;stroke:#15803d;stroke-width:3}
      .badge{fill:#2a6fa0;stroke:#ffffff;stroke-width:2}
      .badgeText{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
      .dead{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#94a3b8;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text class="title" x="56" y="58">DFS：先沿一条分支走到底，再回溯</text>
  <text class="sub" x="56" y="91">约定邻居按从左到右生成；使用栈时，需要按相反顺序压栈。</text>

  <g aria-hidden="true">
    <line class="edge" x1="600" y1="150" x2="290" y2="270"/>
    <line class="edge" x1="600" y1="150" x2="600" y2="270"/>
    <line class="edge" x1="600" y1="150" x2="910" y2="270"/>
    <line class="edge" x1="290" y1="270" x2="185" y2="390"/>
    <line class="edge" x1="290" y1="270" x2="395" y2="390"/>
    <line class="edge" x1="185" y1="390" x2="125" y2="510"/>
    <line class="edge" x1="185" y1="390" x2="245" y2="510"/>
    <line class="edge" x1="395" y1="390" x2="395" y2="510"/>
    <line class="edge" x1="600" y1="270" x2="600" y2="390"/>
    <line class="edge" x1="910" y1="270" x2="910" y2="390"/>
  </g>

  <g filter="url(#shadow)">
    <circle class="visited" cx="600" cy="150" r="34"/><text class="label" x="600" y="151">S</text>
    <circle class="visited" cx="290" cy="270" r="34"/><text class="label" x="290" y="271">A</text>
    <circle class="visited" cx="600" cy="270" r="34"/><text class="label" x="600" y="271">B</text>
    <circle class="visited" cx="910" cy="270" r="34"/><text class="label" x="910" y="271">C</text>
    <circle class="visited" cx="185" cy="390" r="34"/><text class="label" x="185" y="391">D</text>
    <circle class="visited" cx="395" cy="390" r="34"/><text class="label" x="395" y="391">E</text>
    <circle class="visited" cx="600" cy="390" r="34"/><text class="label" x="600" y="391">F</text>
    <circle class="goal" cx="910" cy="390" r="36"/><text class="label" x="910" y="391">G</text>
    <circle class="visited" cx="125" cy="510" r="34"/><text class="label" x="125" y="511">H</text>
    <circle class="visited" cx="245" cy="510" r="34"/><text class="label" x="245" y="511">I</text>
    <circle class="visited" cx="395" cy="510" r="34"/><text class="label" x="395" y="511">J</text>
  </g>

  <g aria-hidden="true">
    <g transform="translate(624 126)"><circle class="badge" r="13"/><text class="badgeText" y="1">1</text></g>
    <g transform="translate(314 246)"><circle class="badge" r="13"/><text class="badgeText" y="1">2</text></g>
    <g transform="translate(209 366)"><circle class="badge" r="13"/><text class="badgeText" y="1">3</text></g>
    <g transform="translate(149 486)"><circle class="badge" r="13"/><text class="badgeText" y="1">4</text></g>
    <g transform="translate(269 486)"><circle class="badge" r="13"/><text class="badgeText" y="1">5</text></g>
    <g transform="translate(419 366)"><circle class="badge" r="13"/><text class="badgeText" y="1">6</text></g>
    <g transform="translate(419 486)"><circle class="badge" r="13"/><text class="badgeText" y="1">7</text></g>
    <g transform="translate(624 246)"><circle class="badge" r="13"/><text class="badgeText" y="1">8</text></g>
    <g transform="translate(624 366)"><circle class="badge" r="13"/><text class="badgeText" y="1">9</text></g>
    <g transform="translate(934 246)"><circle class="badge" r="13"/><text class="badgeText" y="1">10</text></g>
    <g transform="translate(936 364)"><circle class="badge" r="13"/><text class="badgeText" y="1">11</text></g>
  </g>

  <text class="dead" x="125" y="562">死路</text>
  <text class="dead" x="245" y="562">死路</text>
  <text class="dead" x="395" y="562">死路</text>
  <text class="dead" x="600" y="442">死路</text>
  <text class="small" x="910" y="449" fill="#15803d">目标</text>

  <rect x="54" y="594" width="1092" height="40" rx="20" fill="#e8f2fb"/>
  <text class="sub" x="600" y="620" text-anchor="middle" fill="#1e557c">访问顺序　S → A → D → H → I → E → J → B → F → C → G</text>
</svg>
