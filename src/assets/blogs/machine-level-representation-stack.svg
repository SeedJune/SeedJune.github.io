<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
  <title id="title">函数 P 调用 Q 时的通用栈帧结构</title>
  <desc id="desc">高地址在上，低地址在下。由上至下依次是更早的栈帧、调用者 P 的栈帧和正在执行的 Q 的栈帧。P 的帧中示意栈参数 n 到参数 7，底部是 call 压入的返回地址。Q 的帧包含保存的寄存器、局部变量和参数构造区。栈向低地址增长，百分号 rsp 指向当前栈顶。各区可以省略，也可能包含对齐填充。</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;fill:#25314e}
      .heading{font-size:30px;font-weight:750}
      .subtitle{font-size:20px;fill:#677080}
      .label{font-size:25px;font-weight:600}
      .small{font-size:20px;fill:#677080}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .rule{stroke:#384a70;stroke-width:2;fill:none}
      .bracket{stroke:#384a70;stroke-width:2.5;fill:none;stroke-linecap:round}
    </style>
    <marker id="indigo-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#384a70"/></marker>
    <marker id="coral-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#d8694f"/></marker>
  </defs>

  <rect width="1000" height="840" rx="26" fill="#f3eee4"/>
  <text x="48" y="59" class="heading">函数调用时，栈里留下了什么</text>
  <text x="49" y="95" class="subtitle">x86-64 · System V AMD64 ABI · 以普通整数 / 指针参数为例</text>

  <text x="88" y="164" text-anchor="middle" class="small">高地址</text>
  <path d="M88 619V199" stroke="#384a70" stroke-width="2.5" fill="none" marker-end="url(#indigo-arrow)"/>
  <text x="59" y="410" text-anchor="middle" class="small" transform="rotate(-90 59 410)">地址增大</text>
  <text x="88" y="661" text-anchor="middle" class="small">低地址</text>

  <path d="M213 272V603" stroke="#d8694f" stroke-width="2.5" fill="none" marker-end="url(#coral-arrow)"/>
  <text x="181" y="437" text-anchor="middle" font-size="21" transform="rotate(-90 181 437)" style="fill:#bb604d">栈向低地址增长</text>

  <rect x="279" y="145" width="350" height="94" fill="#e8e3d9"/>
  <rect x="279" y="239" width="350" height="166" fill="#e3eaf3"/>
  <rect x="279" y="405" width="350" height="52" fill="#f1d6ca"/>
  <rect x="279" y="457" width="350" height="222" fill="#e0ebe5"/>
  <rect x="279" y="145" width="350" height="534" rx="2" fill="none" stroke="#384a70" stroke-width="3"/>
  <g class="rule">
    <path d="M279 239H629M279 283H629M279 329H629M279 359H629M279 405H629M279 457H629M279 531H629M279 605H629"/>
  </g>

  <text x="454" y="130" text-anchor="middle" class="small">栈底一侧</text>
  <text x="454" y="203" text-anchor="middle" font-size="36" fill="#858b96">⋮</text>
  <text x="454" y="268" text-anchor="middle" font-size="27">···</text>
  <text x="454" y="314" text-anchor="middle" class="label">参数 n</text>
  <text x="454" y="352" text-anchor="middle" font-size="27">···</text>
  <text x="454" y="390" text-anchor="middle" class="label">参数 7</text>
  <text x="454" y="440" text-anchor="middle" class="label">返回地址</text>
  <text x="454" y="502" text-anchor="middle" class="label">被保存的寄存器</text>
  <text x="454" y="576" text-anchor="middle" class="label">局部变量</text>
  <text x="454" y="650" text-anchor="middle" class="label">参数构造区</text>

  <path d="M650 146H664V238H650M650 240H664V456H650M650 458H664V678H650" class="bracket"/>
  <text x="697" y="201" class="label">更早的栈帧</text>
  <text x="697" y="326" class="label">调用者 P 的帧</text>
  <text x="697" y="358" class="small">传给 Q 的栈参数</text>
  <text x="697" y="535" class="label">正在执行的</text>
  <text x="697" y="570" class="label">函数 Q 的帧</text>
  <text x="697" y="637" class="small">为下一次调用</text>
  <text x="697" y="666" class="small">准备栈参数</text>

  <path d="M196 704H246V679H276" stroke="#384a70" stroke-width="2.5" fill="none" marker-end="url(#indigo-arrow)"/>
  <text x="80" y="711" class="label mono">%rsp</text>
  <text x="454" y="714" text-anchor="middle" class="label">当前栈顶</text>

  <path d="M48 743H952" stroke="#d7cebf" stroke-width="1.5"/>
  <text x="49" y="776" class="small">返回地址由 call 压入；沿用传统画法，画在 P 帧底部、Q 帧上方。</text>
  <text x="49" y="809" class="small">这是一张示意图：各区可省略，也可能含对齐填充，实际布局由编译器决定。</text>
</svg>
