<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">A 星搜索演示</title>
  <desc id="desc">A 星在一个带权图上按 f 等于 g 加 h 的值扩展 S、B、D、G，返回总代价为 6 的路径 S 到 B 到 D 到 G。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .nodeName{font:800 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}
      .score{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569;text-anchor:middle}
      .tag{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;text-anchor:middle}
      .cost{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;text-anchor:middle;dominant-baseline:middle}
      .edge{fill:none;stroke:#b8c3d1;stroke-width:3;marker-end:url(#arrow)}
      .chosen{stroke:#2563eb;stroke-width:7}
      .node{fill:#ffffff;stroke:#94a3b8;stroke-width:2.5}
      .expanded{fill:#e8f2fb;stroke:#2a6fa0;stroke-width:3}
      .goal{fill:#dcfce7;stroke:#15803d;stroke-width:3}
      .step{fill:#2a6fa0;stroke:#ffffff;stroke-width:2}
      .stepText{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1200" height="680" rx="24" fill="#f8fafc"/>
  <text class="title" x="56" y="58">A*：每次扩展 f(n)=g(n)+h(n) 最小的节点</text>
  <text class="sub" x="56" y="91">蓝色路径是最终结果；当 f 相同，本例用较小的 h 打破平局。</text>

  <g aria-hidden="true">
    <path class="edge" d="M151 304 L281 213"/>
    <path class="edge chosen" d="M151 336 L281 427"/>
    <path class="edge" d="M379 188 L521 149"/>
    <path class="edge" d="M379 220 L569 306"/>
    <path class="edge chosen" d="M379 442 L569 350"/>
    <path class="edge" d="M379 458 L521 505"/>
    <path class="edge" d="M619 151 L941 304"/>
    <path class="edge chosen" d="M671 330 L929 330"/>
    <path class="edge" d="M619 509 L941 356"/>
  </g>

  <g aria-hidden="true">
    <g transform="translate(218 247)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">2</text></g>
    <g transform="translate(218 393)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/><text class="cost" y="1">2</text></g>
    <g transform="translate(450 166)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">2</text></g>
    <g transform="translate(472 260)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">5</text></g>
    <g transform="translate(473 397)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/><text class="cost" y="1">2</text></g>
    <g transform="translate(450 486)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">4</text></g>
    <g transform="translate(782 224)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">5</text></g>
    <g transform="translate(802 330)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#93c5fd"/><text class="cost" y="1">2</text></g>
    <g transform="translate(782 436)"><rect x="-17" y="-13" width="34" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text class="cost" y="1">2</text></g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(105 320)">
      <rect class="expanded" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">S</text><text class="score" y="13">g=0 h=5</text><text class="score" y="34">f=5</text>
      <circle class="step" cx="48" cy="-39" r="14"/><text class="stepText" x="48" y="-38">1</text>
    </g>
    <g transform="translate(330 195)">
      <rect class="node" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">A</text><text class="score" y="13">g=2 h=4</text><text class="score" y="34">f=6</text>
      <rect x="-28" y="-66" width="56" height="22" rx="11" fill="#f1f5f9"/><text class="tag" y="-51" fill="#64748b">OPEN</text>
    </g>
    <g transform="translate(330 445)">
      <rect class="expanded" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">B</text><text class="score" y="13">g=2 h=3</text><text class="score" y="34">f=5</text>
      <circle class="step" cx="48" cy="-39" r="14"/><text class="stepText" x="48" y="-38">2</text>
    </g>
    <g transform="translate(570 135)">
      <rect class="node" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">C</text><text class="score" y="13">g=— h=4</text><text class="score" y="34">尚未生成</text>
    </g>
    <g transform="translate(620 330)">
      <rect class="expanded" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">D</text><text class="score" y="13">g=4 h=2</text><text class="score" y="34">f=6</text>
      <circle class="step" cx="48" cy="-39" r="14"/><text class="stepText" x="48" y="-38">3</text>
    </g>
    <g transform="translate(570 525)">
      <rect class="node" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">E</text><text class="score" y="13">g=6 h=2</text><text class="score" y="34">f=8</text>
      <rect x="-28" y="-66" width="56" height="22" rx="11" fill="#f1f5f9"/><text class="tag" y="-51" fill="#64748b">OPEN</text>
    </g>
    <g transform="translate(985 330)">
      <rect class="goal" x="-58" y="-49" width="116" height="98" rx="18"/>
      <text class="nodeName" y="-13">G</text><text class="score" y="13">g=6 h=0</text><text class="score" y="34">f=6</text>
      <circle class="step" cx="48" cy="-39" r="14" fill="#15803d"/><text class="stepText" x="48" y="-38">4</text>
    </g>
  </g>

  <g transform="translate(56 590)">
    <rect width="1088" height="62" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="sub" x="24" y="38">扩展顺序：</text>
    <text class="sub" x="132" y="38" fill="#1d4ed8" font-weight="700">S → B → D → G</text>
    <text class="sub" x="358" y="38">；最优路径代价：</text>
    <text class="sub" x="505" y="38" fill="#1d4ed8" font-weight="700">2 + 2 + 2 = 6</text>
    <text class="sub" x="680" y="38">；A 与 D 同为 f=6 时，较小的 h 让 D 先扩展。</text>
  </g>
</svg>
