name: Deploy to GitHub Pages

# Every push to main publishes the site. It can also be run by hand from the
# Actions tab (workflow_dispatch) — useful for re-deploying without a commit.
#
# Requires: Repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Detects pnpm from pnpm-lock.yaml, installs, runs `astro build`,
      # and uploads dist/ as the Pages artifact.
      #
      # `package-manager` is deliberately NOT set. Setting it makes this action
      # pass an explicit --version to pnpm/action-setup, which then refuses to
      # run because package.json already pins one via "packageManager" — it
      # rejects having two sources at all, even when they agree. Left unset,
      # the action finds pnpm-lock.yaml, sees the packageManager field, and
      # passes no version, so CI installs exactly the pnpm that field names.
      # Change the pnpm version in package.json, never here.
      - name: Build site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
