name: Deploy to GitHub Pages

# TO GO LIVE, two steps:
#   1. Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   2. Uncomment the `push` trigger below, commit, and push.
#
# Until then the site is only deployed if you run this workflow by hand from
# the Actions tab, so pushing code never publishes anything by accident.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Detects pnpm from pnpm-lock.yaml, installs, runs `astro build`,
      # and uploads dist/ as the Pages artifact.
      - name: Build site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
